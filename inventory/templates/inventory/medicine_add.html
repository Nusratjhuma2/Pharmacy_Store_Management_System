{% extends 'base.html' %}
{% block title %}Add Medicine - Pharmacy{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-body">
        <h4 class="mb-3">Add Medicine</h4>
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Name</label>
              <input class="form-control" name="name" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Generic Name</label>
              <input class="form-control" name="generic_name" placeholder="e.g., Paracetamol">
            </div>
            <div class="col-md-6">
              <label class="form-label">Weight</label>
              <input class="form-control" name="weight" placeholder="e.g., 10 mg/ml">
            </div>
            <div class="col-md-6">
              <label class="form-label">Manufacturer</label>
              <input class="form-control" name="manufacturer">
            </div>
            <div class="col-md-4">
              <label class="form-label">Batch Number</label>
              <input class="form-control" name="batch_number">
            </div>
            <div class="col-md-4">
              <label class="form-label">Expiry Date</label>
              <input type="date" class="form-control" name="expiry_date">
            </div>
            <div class="col-md-2">
              <label class="form-label">Stock</label>
              <input type="number" min="0" class="form-control" name="quantity_in_stock" value="0">
            </div>
            <div class="col-md-2">
              <label class="form-label">Unit Price</label>
              <input type="number" step="0.01" min="0" class="form-control" name="unit_price" value="0.00">
            </div>
            <div class="col-12">
              <label class="form-label">Indications</label>
              <textarea class="form-control" name="indications" rows="3" placeholder="Brief description of indications"></textarea>
            </div>
            <div class="col-12">
              <label class="form-label">Image</label>
              <input type="file" class="form-control" name="image" accept="image/*">
            </div>
          </div>
          <div class="mt-3 d-flex gap-2">
            <button class="btn btn-primary" type="submit">Save</button>
            <a class="btn btn-outline-secondary" href="{% url 'medicine_list' %}">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
