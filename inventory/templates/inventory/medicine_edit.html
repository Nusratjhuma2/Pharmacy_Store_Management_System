{% extends 'base.html' %}
{% block title %}Edit Medicine - Pharmacy{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-body">
        <h4 class="mb-3">Edit Medicine</h4>
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Name</label>
              <input class="form-control" name="name" value="{{ medicine.name }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Generic Name</label>
              <input class="form-control" name="generic_name" value="{{ medicine.generic_name }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Weight</label>
              <input class="form-control" name="weight" value="{{ medicine.weight }}" placeholder="e.g., 10 mg/ml">
            </div>
            <div class="col-md-6">
              <label class="form-label">Manufacturer</label>
              <input class="form-control" name="manufacturer" value="{{ medicine.manufacturer }}">
            </div>
            <div class="col-md-4">
              <label class="form-label">Batch Number</label>
              <input class="form-control" name="batch_number" value="{{ medicine.batch_number }}">
            </div>
            <div class="col-md-4">
              <label class="form-label">Expiry Date</label>
              <input type="date" class="form-control" name="expiry_date" value="{{ medicine.expiry_date|date:'Y-m-d' }}">
            </div>
            <div class="col-md-2">
              <label class="form-label">Stock</label>
              <input type="number" min="0" class="form-control" name="quantity_in_stock" value="{{ medicine.quantity_in_stock }}">
            </div>
            <div class="col-md-2">
              <label class="form-label">Unit Price</label>
              <input type="number" step="0.01" min="0" class="form-control" name="unit_price" value="{{ medicine.unit_price }}">
            </div>
            <div class="col-12">
              <label class="form-label">Indications</label>
              <textarea class="form-control" name="indications" rows="3">{{ medicine.indications }}</textarea>
            </div>
            <div class="col-12">
              <label class="form-label">Image</label>
              {% if medicine.image %}
                <div class="mb-2"><img src="{{ medicine.image.url }}" alt="{{ medicine.name }}" style="height:80px; width:80px; object-fit:cover; border-radius:.5rem; border:1px solid #e2e8f0;"></div>
              {% endif %}
              <input type="file" class="form-control" name="image" accept="image/*">
            </div>
          </div>
          <div class="mt-3 d-flex gap-2">
            <button class="btn btn-primary" type="submit">Save Changes</button>
            <a class="btn btn-outline-secondary" href="{% url 'medicine_list' %}">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
